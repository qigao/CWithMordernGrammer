name: Publication

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manuscript:
    name: Validate and build manuscript (${{ matrix.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        edition:
          - cn
          - en

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate book
        run: python scripts/validate_book.py --edition "${{ matrix.edition }}"

      - name: Build canonical manuscript
        run: python scripts/build_book.py --edition "${{ matrix.edition }}"

      - name: Upload manuscript
        uses: actions/upload-artifact@v4
        with:
          name: c-with-modern-grammar-manuscript-${{ matrix.edition }}
          path: dist/${{ matrix.edition }}/C-with-Modern-Grammar.md
          if-no-files-found: error
          retention-days: 14
